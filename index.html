<!DOCTYPE html>
<html>

<head>

    <title>Royal Sweetness</title>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;

            background-image:url('back drop.png');
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;

            font-family:Arial, sans-serif;
        }

        header{

            background-color:black;

            height:120px;

            display:flex;

            align-items:center;

            justify-content:space-between;

            padding-left:30px;
            padding-right:30px;
        }

        .logo-section{

            display:flex;

            align-items:center;
        }

        .logo{

            height:110px;

            width:auto;
        }

        .company-name{

            margin-left:15px;

            color:#D4AF37;

            font-family:'Great Vibes', cursive;

            font-size:55px;
        }

        nav a{

            color:white;

            text-decoration:none;

            margin-left:30px;

            font-size:20px;

            font-weight:bold;

            padding:10px 15px;

    border:1px solid #D4AF37;

    border-radius:6px;

    transition:0.3s;
}

nav a:hover{

    background-color:#D4AF37;

    color:black;
}

        .hero{

            height:calc(100vh - 120px);

            display:flex;

            justify-content:center;

            align-items:center;

            flex-direction:column;
        }

        .welcome-box{

            background-color:rgba(0,0,0,.7);

            padding:40px;

            border-radius:15px;

            text-align:center;

            color:white;
        }

        .welcome-box h1{

            font-size:60px;

            margin-bottom:15px;
        }

        .welcome-box p{

            font-size:22px;
        }

    </style>

</head>

<body>

    <header>

        <div class="logo-section">

            <img src="logo.png" class="logo">

            <div class="company-name">
                Royal Sweetness
            </div>

        </div>

        <nav>

            <a href="index.html">Home</a>

            <a href="menu.html">Menu</a>

            <a href="about.html">About Us</a>

            <a href="socialmedia.html">Social Media</a>

        </nav>

    </header>

    <div class="hero">

        <div class="welcome-box">

            <h1>Welcome</h1>

            <p>Handcrafted cakes, dipped treats, and desserts made with love.</p>

        </div>

    </div>

</body>

</html>
