<!DOCTYPE html>
<html>

<head>
    <title>My Pastry Shop</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff8f2;
            text-align: center;
            margin: 0;
        }

        header {
            background-color: #d99b66;
            color: white;
            padding: 30px;
        }

        h1 {
            margin: 0;
        }

        .menu {
            padding: 30px;
        }

        .item {
            background: white;
            width: 300px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px lightgray;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Pastry Shop</h1>
        <p>Fresh pastries made to order</p>
    </header>

    <div class="menu">

        <div class="item">
            <h2>Chocolate Croissant</h2>
            <p>$4</p>
        </div>

        <div class="item">
            <h2>Macaron Box</h2>
            <p>$15</p>
        </div>

        <div class="item">
            <h2>Fruit Tart</h2>
            <p>$20</p>
        </div>

    </div>

</body>

</html>
